# DavMail IMAP Archive Filter 配置文件
# 修改此文件后，需重启 davmail-filter 服务：
#   systemctl --user restart davmail-filter

[davmail_filter]
# 上游 DavMail 服务器
upstream_host = 127.0.0.1
upstream_port = 1143

# 本地监听端口
listen_port = 17143

# 过滤模式：
#   whitelist：只保留下面规则匹配的文件夹，其余丢弃
#   blacklist：只丢弃下面规则匹配的文件夹，其余保留
mode = whitelist

# 匹配规则，每行一条：
#   prefix:/xxx   前缀匹配（文件夹名以 /xxx 开头）
#   exact:/xxx    精确匹配（文件夹名完全等于 /xxx）
#   regex:/xxx/   正则表达式匹配
rules =
    exact:archive
    prefix:/archive/
